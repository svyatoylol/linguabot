<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свинки AI Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
        }

        .chat-header {
            background: #007acc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .user-msg {
            background: #4caf50;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .ai-msg {
            background: #007acc;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0.85;
            color: white;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .speak-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .loading-msg {
            color: #888;
            font-style: italic;
            align-self: flex-start;
            padding-left: 5px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
            background: white;
            gap: 10px;
        }

            .input-area input {
                flex: 1;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                outline: none;
            }

            .input-area button {
                padding: 10px 20px;
                background: #007acc;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

                .input-area button:hover {
                    background: #005999;
                }

                .input-area button.voice-btn {
                    padding: 10px 15px;
                    background: #5c6bc0;
                    font-size: 1.1em;
                }

                .input-area button.voice-btn:hover {
                    background: #3f51b5;
                }

                .input-area button.recording {
                    background: #e53935 !important;
                    animation: pulse 1s infinite alternate;
                }

        @keyframes pulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.08); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Свинки AI Чат (.NET Core)</div>
        <div class="messages-area" id="messagesArea">
            <div class="message ai-msg">Привет! Архитектура приложения настроена. Напиши мне что-нибудь или используй микрофон, чтобы протестировать бэкенд!</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Введите сообщение..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="voiceBtn" class="voice-btn" type="button" onclick="toggleVoiceRecording()" title="Голосовой ввод">🎤</button>
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];

        async function toggleVoiceRecording() {
            const voiceBtn = document.getElementById('voiceBtn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    voiceBtn.classList.remove('recording');
                    voiceBtn.innerText = '🎤';
                    voiceBtn.disabled = true;

                    // Останавливаем все аудио-треки для освобождения микрофона
                    stream.getTracks().forEach(track => track.stop());

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (audioBlob.size === 0) {
                        voiceBtn.disabled = false;
                        return;
                    }

                    const formData = new FormData();
                    formData.append('audio', audioBlob, 'recording.webm');

                    // Индикатор распознавания
                    const loadingDiv = document.createElement('div');
                    loadingDiv.className = 'message loading-msg';
                    loadingDiv.id = 'voice-loading';
                    loadingDiv.innerText = 'Распознавание речи (Groq Whisper)...';
                    document.getElementById('messagesArea').appendChild(loadingDiv);
                    document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;

                    try {
                        const res = await fetch('/api/voice', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        document.getElementById('voice-loading')?.remove();

                        if (res.ok && data.text) {
                            document.getElementById('userInput').value = data.text;
                            sendMessage();
                        } else {
                            alert(data.text || 'Не удалось распознать речь.');
                        }
                    } catch (err) {
                        document.getElementById('voice-loading')?.remove();
                        alert('Ошибка отправки аудио: ' + err.message);
                    } finally {
                        voiceBtn.disabled = false;
                    }
                };

                mediaRecorder.start();
                voiceBtn.classList.add('recording');
                voiceBtn.innerText = '⏹';
            } catch (err) {
                alert('Не удалось получить доступ к микрофону: ' + err.message);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messagesArea = document.getElementById('messagesArea');
            const text = input.value.trim();

            if (!text) return;

            // 1. Выводим на экран сообщение пользователя
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            messagesArea.appendChild(userDiv);
            input.value = '';
            messagesArea.scrollTop = messagesArea.scrollHeight;

            // 2. Показываем анимацию загрузки ("ИИ думает...")
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message loading-msg';
            loadingDiv.id = 'loading';
            loadingDiv.innerText = 'ИИ печатает...';
            messagesArea.appendChild(loadingDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;

            try {
                // 3. Делаем реальный запрос к нашему .NET API эндпоинту
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                // Удаляем индикатор загрузки
                document.getElementById('loading').remove();

                // 4. Выводим ответ, который прислал сервер на C#
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-msg';

                const textSpan = document.createElement('span');
                textSpan.innerText = data.text;
                aiDiv.appendChild(textSpan);

                const speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.title = 'Озвучить ответ (Piper TTS)';
                speakBtn.innerText = '🔊';
                speakBtn.onclick = () => playTts(speakBtn, data.text);
                aiDiv.appendChild(speakBtn);

                messagesArea.appendChild(aiDiv);
            } catch (error) {
                document.getElementById('loading').remove();
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai-msg';
                errorDiv.style.background = '#f44336';
                errorDiv.innerText = 'Ошибка: Бэкенд не отвечает.';
                messagesArea.appendChild(errorDiv);
            }

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function playTts(btn, text) {
            if (btn.dataset.playing === 'true') return;
            btn.dataset.playing = 'true';
            const originalText = btn.innerText;
            btn.innerText = '⏳';

            try {
                const url = '/api/tts?text=' + encodeURIComponent(text);
                const audio = new Audio(url);

                audio.onended = () => {
                    btn.dataset.playing = 'false';
                    btn.innerText = originalText;
                };

                audio.onerror = async () => {
                    btn.dataset.playing = 'false';
                    btn.innerText = originalText;
                    try {
                        const res = await fetch(url);
                        const err = await res.json();
                        alert(err.error || 'Ошибка воспроизведения речи.');
                    } catch {
                        alert('Не удалось получить озвучку от сервера.');
                    }
                };

                await audio.play();
            } catch (err) {
                btn.dataset.playing = 'false';
                btn.innerText = originalText;
                alert('Ошибка воспроизведения: ' + err.message);
            }
        }</script>
</body>
</html>
